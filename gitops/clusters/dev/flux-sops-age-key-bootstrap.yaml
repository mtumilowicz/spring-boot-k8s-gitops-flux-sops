apiVersion: v1
kind: Secret
metadata:
  name: k8s-plain-secrets-dev
  namespace: flux-system
type: Opaque
stringData:
  # Plaintext bootstrap secret for the workshop.
  # Kubernetes accepts stringData directly and stores it as base64-encoded Secret data.
  # Flux reads this key to decrypt SOPS-encrypted dev application secrets.
  # Do not commit this kind of private key in a real system.
  identity.agekey: |
    # Replace this block with the dev age private key.
    AGE-SECRET-KEY-1MMQ0RVPGF5M6W2PQP5D7EXW7Q0M2JU029RET2KGXMCRVKLN4H9RQM4X8U8
