apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spring-boot-k8s-gitops-flux-sops-dev
  namespace: flux-system
spec:
  interval: 30s
  retryInterval: 10s
  timeout: 3m
  path: ./gitops/overlays/dev
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: spring-boot-k8s-gitops-flux-sops-dev
  decryption:
    provider: sops
    secretRef:
      name: k8s-plain-secrets
