apiVersion: v1
kind: Secret
metadata:
  name: k8s-plain-secrets-prod
  namespace: flux-system
type: Opaque
stringData:
  # Plaintext bootstrap secret for the workshop.
  # Kubernetes accepts stringData directly and stores it as base64-encoded Secret data.
  # Flux reads this key to decrypt SOPS-encrypted prod application secrets.
  # Do not commit this kind of private key in a real system.
  identity.agekey: |
    # Replace this block with the prod age private key.
    AGE-SECRET-KEY-1GN9ZD8P2FZH3WEW0052XUH3FNQVDKAREE3JNRPT8VLFT945763ZSUHEA4U